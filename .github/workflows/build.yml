name: Crear APK

on:
  push:
    branches: [main]
    paths: ['android.zip', 'near-music.jks.enc', '.github/workflows/build.yml']
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Descomprimir el proyecto
        run: unzip -o android.zip -d src

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # near-music.jks.enc es la llave cifrada. Sin la contraseña del secret
      # NEAR_KEYSTORE_PASS ese archivo no sirve para nada.
      - name: Preparar la llave de firma
        env:
          LLAVE_PASS: ${{ secrets.NEAR_KEYSTORE_PASS }}
        run: |
          if [ -z "$LLAVE_PASS" ]; then
            echo "Falta el secret NEAR_KEYSTORE_PASS."
            echo "Créalo en Settings > Secrets and variables > Actions."
            exit 1
          fi

          # Se quitan espacios y saltos que el navegador pueda haber metido al pegar.
          PASS=$(printf '%s' "$LLAVE_PASS" | tr -d '[:space:]')

          if ! openssl enc -d -aes-256-cbc -pbkdf2 -iter 600000 -a \
                -in near-music.jks.enc -out src/android/app/near-music.jks \
                -pass pass:"$PASS" 2>/dev/null; then
            echo "No se pudo descifrar la llave: la contraseña de NEAR_KEYSTORE_PASS no es la correcta."
            echo "Pégala de nuevo, tal cual, sin espacios delante ni detrás."
            exit 1
          fi

          if ! keytool -list -keystore src/android/app/near-music.jks \
                -storepass "$PASS" -alias nearmusic > /dev/null 2>&1; then
            echo "La llave se descifró pero no se abre con esa contraseña."
            exit 1
          fi
          echo "Llave lista y comprobada."

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.11.1'

      - name: Crear APK
        working-directory: src/android
        env:
          NEAR_KEYSTORE_PASS: ${{ secrets.NEAR_KEYSTORE_PASS }}
          NEAR_KEY_ALIAS: nearmusic
        run: gradle assembleRelease --no-daemon --stacktrace

      - name: Comprobar que el APK quedó firmado
        run: |
          APK=src/android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$APK" ]; then
            echo "No se generó el APK firmado. Revisa el secret NEAR_KEYSTORE_PASS."
            ls -R src/android/app/build/outputs/apk || true
            exit 1
          fi

      - name: Borrar la llave del disco
        if: always()
        run: rm -f src/android/app/near-music.jks

      - name: Preparar archivo
        run: cp src/android/app/build/outputs/apk/release/app-release.apk MiMusica.apk

      - name: Publicar descarga
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ github.run_number }}
          name: Mi Música ${{ github.run_number }}
          body: Descarga MiMusica.apk e instálala en tu teléfono.
          files: MiMusica.apk
          make_latest: true
